name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifeconnect
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lifeconnect_migration_test   # EMPTY throwaway DB used by the migration tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lifeconnect" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Enables the Postgres variants of the migration and advisory-lock tests.
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://lifeconnect:ci-only-password@localhost:5432/lifeconnect_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Settings for the test process (placeholders only)
        run: cp .env.example .env
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node dependencies (production)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lifeconnect-api:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lifeconnect-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
