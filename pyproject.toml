[project]
name = "lifeconnect-api"
version = "1.0.0"
description = "Blood Donation Management System API"
license = { text = "MIT" }
requires-python = ">=3.11"

authors = [
    { name = "LifeConnect Team" }
]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.3.0",
    "SQLAlchemy==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.5",
    "PyJWT==2.15.0",
    "bcrypt==4.2.1",
    "python-multipart==0.0.32",
    "APScheduler==3.11.3",
    "httpx==0.28.1",
    "aiosmtplib==5.1.2",
    "pillow==13.0.0",
    "structlog==26.1.0",
    "slowapi==0.1.10",
    "python-dotenv==1.2.2",
]

# Tell hatch where the package is (since it's "app" not "lifeconnect_api")
[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # legacy handlers raise HTTPException from generic exception blocks
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/**/*.py" = ["B008", "B904"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
