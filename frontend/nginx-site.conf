root /usr/share/nginx/html;
index index.html;
include snippets/security-headers.conf;

location ^~ /api/ {
    proxy_pass http://lifeconnect_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # The API supplies its own policy headers. This add_header replaces inherited SPA
    # headers for this location and also covers CORS responses and upstream errors.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security $lifeconnect_hsts always;
}

location / {
    try_files $uri $uri/ /index.html;
}

# Only Vite's fingerprinted build directory gets long-lived caching.
location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
}
