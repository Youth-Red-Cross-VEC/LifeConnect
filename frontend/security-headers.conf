# Security headers for the SPA (HTML and static assets). Included from nginx.conf.
#
# nginx rule: an add_header in a location REPLACES the headers inherited from the server block, so this file
# is included explicitly in every location that serves SPA content. /api/ is not included: the API sets its
# own headers (app/core/middleware.py) and nginx passes them through.
#
# Content-Security-Policy is built from what the frontend really loads:
#   - same-origin script bundle (Vite output, no inline scripts, no eval)
#   - reCAPTCHA v3 (react-google-recaptcha-v3): script from www.google.com/recaptcha and www.gstatic.com/recaptcha,
#     iframe from www.google.com/recaptcha
#   - CSS @import of Font Awesome (cdnjs.cloudflare.com, which also serves its webfonts) and Google Fonts
#     (fonts.googleapis.com for CSS, fonts.gstatic.com for files)
#   - inline <style> blocks in the pages -> style-src 'unsafe-inline' (scripts stay strict)
#   - API calls: same origin only (VITE_API_URL is empty behind nginx). If you build the SPA against a different
#     API origin, add it to connect-src.
# Not verified in a real browser here. Check the console for CSP violations on the login pages (reCAPTCHA),
# the landing page (icons) and the signup page (fonts) before relying on it.
#

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://www.gstatic.com; connect-src 'self'; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
