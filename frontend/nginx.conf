server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the FastAPI backend service.
    # $proxy_add_x_forwarded_for appends the real client address to whatever the client sent; the API
    # (uvicorn --proxy-headers, trusting only this container) uses the rightmost untrusted address.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # All other routes serve the React SPA (client-side routing)
    location / {
        include snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        include snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

