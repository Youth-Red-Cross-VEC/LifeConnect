map $scheme $lifeconnect_hsts {
    default "";
    https "max-age=31536000";
}

# Docker's embedded DNS lets Nginx recover when Compose replaces the API container.
upstream lifeconnect_api {
    zone lifeconnect_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve;
}

server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz {
        return 204;
    }
}
