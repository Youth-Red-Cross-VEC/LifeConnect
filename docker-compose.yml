# LifeConnect API Docker Configuration

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lifeconnect-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lifeconnect}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifeconnect}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeconnect-api
    ports:
      - "8000:8000"
    env_file:
      - .env  # Load all environment variables from .env file
    environment:
      # Override DATABASE_URL to use Docker network hostname
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lifeconnect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lifeconnect}
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
