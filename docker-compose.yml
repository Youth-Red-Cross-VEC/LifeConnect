# LifeConnect API Docker Configuration

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lifeconnect-db
    environment:
      POSTGRES_USER: lifeconnect
      POSTGRES_PASSWORD: lifeconnect_password
      POSTGRES_DB: lifeconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeconnect-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://lifeconnect:lifeconnect_password@postgres:5432/lifeconnect
      - SECRET_KEY=docker-dev-secret-key-change-in-production-32chars
      - GOOGLE_MAPS_API_KEY=placeholder-for-dev
      - MAIL_SERVER=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=dev@example.com
      - MAIL_PASSWORD=dev-password
      - MAIL_FROM=dev@example.com
      - APP_ENV=development
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:

