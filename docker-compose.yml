# LifeConnect Docker Configuration
#
# Exposure model
#   - This base file serves local HTTP on loopback. Add docker-compose.prod.yml for public HTTPS.
#   - PostgreSQL and the API are reachable only on the compose network. To debug them from the host use
#     the loopback-only override:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   - POSTGRES_PASSWORD has no default: compose refuses to start without it.
#
# Client IP behind nginx
#   The API is the only service that sees the browser through a proxy. Uvicorn runs with --proxy-headers and
#   trusts X-Forwarded-For from exactly one address, the nginx container, which is pinned below. Anything
#   else that connects (and any X-Forwarded-For it sends) is ignored, so rate limits key on the real client.
#   Never set FORWARDED_ALLOW_IPS to "*". If you change the subnet or the frontend address, change both.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lifeconnect-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-lifeconnect}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifeconnect}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeconnect-api
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use Docker network hostname
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lifeconnect}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-lifeconnect}
      # Allow requests from the frontend container and local dev
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:80","http://localhost","http://frontend:80"]
      # Web workers never run scheduled jobs; the `scheduler` service below does.
      - SCHEDULER_ENABLED=false
      # The nginx container (pinned address below) is the only peer whose X-Forwarded-For is believed.
      - FORWARDED_ALLOW_IPS=172.28.0.10
    volumes:
      - ./app/static:/code/app/static
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"

  # Dedicated scheduler: run exactly ONE of these (expiry, donor reactivation, age increments)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeconnect-scheduler
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lifeconnect}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-lifeconnect}
      - SCHEDULER_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: ["python", "-m", "app.scheduler_worker"]
    healthcheck:
      disable: true
    restart: unless-stopped

  # React Frontend (served via nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In Docker, the browser hits the nginx proxy which forwards /api/* to the api service.
        # So VITE_API_URL should be empty string (same origin) — nginx handles the proxy.
        VITE_API_URL: ""
        # reCAPTCHA v3 site key — baked into the JS bundle at build time
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    container_name: lifeconnect-frontend
    ports:
      - "127.0.0.1:80:80"
    networks:
      default:
        # Pinned so the API can trust exactly this address as the reverse proxy (see FORWARDED_ALLOW_IPS).
        ipv4_address: 172.28.0.10
    depends_on:
      - api

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
