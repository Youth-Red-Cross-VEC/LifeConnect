# LifeConnect Docker Configuration

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lifeconnect-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifeconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lifeconnect}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifeconnect}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeconnect-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use Docker network hostname
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lifeconnect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lifeconnect}
      # Allow requests from the frontend container and local dev
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:80","http://localhost","http://frontend:80"]
    volumes:
      - ./app/static:/code/app/static
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # React Frontend (served via nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In Docker, the browser hits the nginx proxy which forwards /api/* to the api service.
        # So VITE_API_URL should be empty string (same origin) — nginx handles the proxy.
        VITE_API_URL: ""
        # reCAPTCHA v3 site key — baked into the JS bundle at build time
        VITE_RECAPTCHA_SITE_KEY: "6LcaqHstAAAAADlXBhXn_zh-JC6WVY7L_fPm98TP"
    container_name: lifeconnect-frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
